name: Build ARM64

on:
  workflow_dispatch:
  push:
    branches: [ arm64-quiche-build ]

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build with Gradle on ARM64
        run: gradle build --no-daemon --stacktrace

      - name: Inspect native libs in proxy jar
        run: |
          unzip -l proxy/build/libs/*.jar | grep -i "META-INF/native" || true
          unzip -l proxy/build/libs/*.jar | grep -i "aarch\|arm\|quiche" || true

      - name: Upload proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-arm64
          path: proxy/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-arm64
          path: bridge/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload bridge-packets artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-packets-arm64
          path: bridge-packets/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error
